<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book a Ride - Vazraa Mobility</title>
<link rel="icon" href="images/vazraa-logo.jpeg">
<link rel="stylesheet" href="style.css?v=8">
<link rel="stylesheet" href="auth.css?v=8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  /* Google Places autocomplete dropdown styling */
  .pac-container {
    border-radius: 12px;
    border: 1px solid var(--border, #e2e8f0);
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    font-family: 'Poppins', sans-serif;
    margin-top: 4px;
    overflow: hidden;
  }
  .pac-item {
    padding: 10px 16px;
    font-size: 13px;
    cursor: pointer;
    border-top: 1px solid #f1f5f9;
  }
  .pac-item:hover { background: #f8fafc; }
  .pac-item-query { font-weight: 600; color: #1b2434; }
  .pac-matched { color: #e8a000; }
  .pac-icon { display: none; }
</style>
</head>
<body>

<!-- ===== HEADER / NAVBAR ===== -->
<div id="site-header"></div>

<main class="page-wrap">
  <div class="container">
    <div class="page-header">
      <h1>Book a Ride</h1>
      <p>Choose your vehicle, enter your trip details, and see your fare instantly.</p>
    </div>

    <div class="book-layout">

      <div class="book-card">
        <h3 style="font-size:15px; margin-bottom:14px;">1. Choose Vehicle Type</h3>
        <div class="vehicle-select-grid" id="vehicleSelectGrid">
          <div class="vehicle-option" data-type="car" data-rate="8"><div class="emoji">🚗</div><h4>Car & Sedan</h4><span>₹8/km</span></div>
          <div class="vehicle-option" data-type="bike" data-rate="2"><div class="emoji">🏍️</div><h4>Bike & Scooter</h4><span>₹2/km</span></div>
        </div>

        <h3 style="font-size:15px; margin-bottom:14px;">2. Trip Details</h3>
        <form class="form-grid" id="rideForm" novalidate>
          <div class="form-row">
            <div class="field">
              <label for="rideFrom">Pickup Location</label>
              <div style="position:relative; display:flex; align-items:center;">
                <input type="text" id="rideFrom" placeholder="Enter pickup location" required style="padding-right: 40px; flex-grow:1;">
                <button type="button" id="locateMeBtn" title="Use my current location" style="position:absolute; right:10px; background:none; border:none; cursor:pointer; font-size:16px; color:var(--gray-400); padding:5px; transition:color 0.2s;">
                  <i class="fa fa-crosshairs"></i>
                </button>
              </div>
            </div>
            <div class="field">
              <label for="rideTo">Drop Location</label>
              <input type="text" id="rideTo" placeholder="Enter drop location" required>
            </div>
          </div>
        </form>
      </div>

      <div class="fare-card">
        <h3>Fare Estimate</h3>
        <div id="fareContent">
          <div class="fare-empty">Select a vehicle type to see your fare estimate.</div>
        </div>
      </div>

    </div>
  </div>
</main>

<!-- ===== FOOTER ===== -->
<div id="site-footer"></div>

<script src="api.config.js?v=8"></script>
<script src="script.js?v=8"></script>
<script src="book-ride.js?v=8"></script>
<script src="include.js?v=8"></script>
<!-- Google Maps Places API — loaded after page scripts so callbacks work -->
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDeaWASPnmwsuems5mpGZ77tKNGEf6UFwY&libraries=places&callback=initGoogleMapsAutocomplete" async defer></script>
</body>
</html>
