server {
    listen 80;
    server_name vazraamobility.com www.vazraamobility.com;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (complement Helmet on the backend)
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection      "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Gzip compression for static assets
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied    any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Cache static assets aggressively
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Serve HTML pages
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Proxy /api/* and /health to the backend service
    location /api/ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Also proxy /api-docs (Swagger) to backend
    location /api-docs/ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Backend health — proxy to backend
    location = /backend-health {
        proxy_pass http://backend:5000/health;
    }

    # Nginx health check (static file, no backend required)
    location = /health.txt {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Root path — directly serve index.html, never attempt directory lookup
    location = / {
        try_files /index.html =404;
    }

    # All other paths — try exact file, then .html extension, else 404
    location / {
        try_files $uri $uri.html =404;
    }

    # Hide nginx version
    server_tokens off;
}
