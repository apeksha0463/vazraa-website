version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Vazraa Mobility — Production Docker Compose
#
# Architecture:
#   frontend (nginx:alpine) ──proxy /api/*──► backend (node:alpine)
#                                                    │
#                                             MongoDB Atlas (cloud)
#
# Usage:
#   1. Copy .env.production → .env  and fill all values
#   2. docker compose build
#   3. docker compose up -d
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Database (MongoDB) ──────────────────────────────────────────────────────
  mongo:
    image: mongo:6.0
    container_name: vazraa-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - vazraa-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Backend (Node.js / Express) ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vazraa-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy

    # Use backend/.env as intentionally designed for the project configurations
    env_file:
      - ./backend/.env

    ports:
      - "5000:5000"

    networks:
      - vazraa-net

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

    # Graceful stop timeout (give Node.js time to finish in-flight requests)
    stop_grace_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Frontend (nginx static + reverse proxy) ──────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: vazraa-frontend
    restart: unless-stopped

    ports:
      - "${FRONTEND_PORT:-80}:80"

    networks:
      - vazraa-net

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health.txt"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    stop_grace_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ── Network ───────────────────────────────────────────────────────────────────
networks:
  vazraa-net:
    driver: bridge
    name: vazraa-net

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  mongo-data:
